# What keeps the pinned workflow steps and the site's tools current. Every 'uses:' names a commit with its version
# beside it, and every Python package its hash; a pin nobody moves rots. One reviewed pull request a week each,
# after a release has been out for three days. Nothing merges it automatically.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Move the pinned workflow steps"
  - package-ecosystem: pip
    directory: "/build"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      tools:
        patterns: ["*"]
    commit-message:
      prefix: "Move the site's pinned tools"
